name: mpc-qt
base: core24
version: '26.07'
adopt-info: mpc-qt-app
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
grade: stable
confinement: strict
icon: mpc-qt.svg

apps:
  mpc-qt:
    command: usr/bin/mpc-qt
    desktop: usr/share/applications/io.github.mpc_qt.mpc-qt.desktop
    common-id: io.github.mpc_qt.mpc-qt
    extensions: [kde-neon-6]
    environment:
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/lib/python3.12/site-packages:$PYTHONPATH
    plugs:
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - udisks2
    slots: [mpris]

plugs:
  shared-memory:
    private: true

package-repositories:
  - type: apt
    url: https://ppa.launchpadcontent.net/ubuntuhandbook1/mpv/ubuntu
    suites: [noble]
    components: [main]
    architectures: [amd64, arm64]
    key-id: F4E48910A020E77056748B745738AE8480447DDF

parts:
  mpc-qt-app:
    plugin: cmake
    source: https://github.com/mpc-qt/mpc-qt.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    parse-info: [data/io.github.mpc_qt.mpc-qt.metainfo.xml]
    build-packages:
      - libmpv-dev
      - libboost-dev
      - libproxy-dev
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DMPCQT_VERSION=$SNAPCRAFT_PROJECT_VERSION-Kyu
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    override-build: |
      craftctl default
      sed -i 's|Name=Media Player Classic Qute Theater|Name=MPC-QT [Kyu]|' $CRAFT_PART_INSTALL/usr/share/applications/io.github.mpc_qt.mpc-qt.desktop

  dependencies:
    after: [mpc-qt-app]
    plugin: python
    source: .
    stage-packages:
      - libmpv2
    python-packages:
      - yt-dlp

  kf6-cleanup:
    after: [dependencies]
    plugin: nil
    source: https://github.com/canonical/gpu-snap.git
    build-snaps:
    - kf6-core24
    - gtk-common-themes
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
      set -eux
      for snap in "kf6-core24" "gtk-common-themes"; do
          cd "/snap/$snap/current" && find . -type f,l \( -name "*.so.*" -o -name "*.so" \) -exec rm -f "$CRAFT_PRIME/{}" \;
      done
